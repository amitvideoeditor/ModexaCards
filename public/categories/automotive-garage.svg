<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="rgba(0,0,0,0.3)" />
    </filter>
  </defs>
  <rect width="300" height="300" rx="48" fill="url(#bg)" />
  <rect x="36" y="36" width="228" height="228" rx="36" fill="url(#glass)"  filter="url(#shadow)" />
  <!-- 5 Gold Stars -->
  <g transform="translate(150, 92)">
    <polygon points="0,-8 2.4,-2.5 8.3,-2.5 3.5,1.2 5.3,6.8 0,3.2 -5.3,6.8 -3.5,1.2 -8.3,-2.5 -2.4,-2.5" fill="#FBBF24" transform="translate(-48, 0)" />
    <polygon points="0,-8 2.4,-2.5 8.3,-2.5 3.5,1.2 5.3,6.8 0,3.2 -5.3,6.8 -3.5,1.2 -8.3,-2.5 -2.4,-2.5" fill="#FBBF24" transform="translate(-24, 0)" />
    <polygon points="0,-10 3,-3.1 10.4,-3.1 4.4,1.5 6.6,8.5 0,4 -6.6,8.5 -4.4,1.5 -10.4,-3.1 -3,-3.1" fill="#FBBF24" transform="translate(0, 0)" />
    <polygon points="0,-8 2.4,-2.5 8.3,-2.5 3.5,1.2 5.3,6.8 0,3.2 -5.3,6.8 -3.5,1.2 -8.3,-2.5 -2.4,-2.5" fill="#FBBF24" transform="translate(24, 0)" />
    <polygon points="0,-8 2.4,-2.5 8.3,-2.5 3.5,1.2 5.3,6.8 0,3.2 -5.3,6.8 -3.5,1.2 -8.3,-2.5 -2.4,-2.5" fill="#FBBF24" transform="translate(48, 0)" />
  </g>
  <!-- Automotive Sports Wheel / Wrench Icon -->
  <g transform="translate(150, 166)">
    <circle cx="0" cy="0" r="34" fill="none" stroke="#FFFFFF" stroke-width="12" />
    <circle cx="0" cy="0" r="22" fill="#0F172A" />
    <!-- Wheel Spokes -->
    <line x1="-22" y1="0" x2="22" y2="0" stroke="#FFFFFF" stroke-width="4.5" />
    <line x1="0" y1="-22" x2="0" y2="22" stroke="#FFFFFF" stroke-width="4.5" />
    <line x1="-15" y1="-15" x2="15" y2="15" stroke="#FFFFFF" stroke-width="4.5" />
    <line x1="-15" y1="15" x2="15" y2="-15" stroke="#FFFFFF" stroke-width="4.5" />
    <circle cx="0" cy="0" r="7" fill="#F59E0B" />
    <!-- Wrench Tool on top right -->
    <path d="M18,-18 L34,-34 C38,-38 42,-34 38,-30 L26,-18 Z" fill="#60A5FA" />
  </g>
</svg>
