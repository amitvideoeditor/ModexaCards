<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.06)" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="rgba(0,0,0,0.3)" />
    </filter>
  </defs>
  <rect width="300" height="300" rx="48" fill="url(#bg)" />
  <rect x="36" y="36" width="228" height="228" rx="36" fill="url(#glass)"  filter="url(#shadow)" />
  <!-- 5 Gold Stars -->
  <g transform="translate(150, 92)">
    <polygon points="0,-8 2.4,-2.5 8.3,-2.5 3.5,1.2 5.3,6.8 0,3.2 -5.3,6.8 -3.5,1.2 -8.3,-2.5 -2.4,-2.5" fill="#FDE047" transform="translate(-48, 0)" />
    <polygon points="0,-8 2.4,-2.5 8.3,-2.5 3.5,1.2 5.3,6.8 0,3.2 -5.3,6.8 -3.5,1.2 -8.3,-2.5 -2.4,-2.5" fill="#FDE047" transform="translate(-24, 0)" />
    <polygon points="0,-10 3,-3.1 10.4,-3.1 4.4,1.5 6.6,8.5 0,4 -6.6,8.5 -4.4,1.5 -10.4,-3.1 -3,-3.1" fill="#FDE047" transform="translate(0, 0)" />
    <polygon points="0,-8 2.4,-2.5 8.3,-2.5 3.5,1.2 5.3,6.8 0,3.2 -5.3,6.8 -3.5,1.2 -8.3,-2.5 -2.4,-2.5" fill="#FDE047" transform="translate(24, 0)" />
    <polygon points="0,-8 2.4,-2.5 8.3,-2.5 3.5,1.2 5.3,6.8 0,3.2 -5.3,6.8 -3.5,1.2 -8.3,-2.5 -2.4,-2.5" fill="#FDE047" transform="translate(48, 0)" />
  </g>
  <!-- Diamond Gem Icon -->
  <g transform="translate(150, 166)">
    <!-- Gem Top Crown -->
    <polygon points="-28,-14 -14,-28 14,-28 28,-14" fill="#FFFFFF" opacity="0.95" />
    <polygon points="-14,-28 0,-14 14,-28" fill="#FDE047" />
    <!-- Gem Lower Pavilion -->
    <polygon points="-28,-14 0,28 28,-14" fill="#FDE68A" />
    <polygon points="-12,-14 0,28 12,-14" fill="#FFFFFF" />
    <!-- Sparkle Rays -->
    <line x1="-36" y1="-26" x2="-44" y2="-34" stroke="#FDE047" stroke-width="3" stroke-linecap="round" />
    <line x1="36" y1="-26" x2="44" y2="-34" stroke="#FDE047" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
